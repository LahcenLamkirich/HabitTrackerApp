workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    working_directory: daily_check
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS (simulator, unsigned)
        script: flutter build ios --release --no-codesign --simulator
    artifacts:
      - daily_check/build/ios/iphonesimulator/*.app
